format = """\
[](bg:#030B16 fg:#ffffff)\
[󰀵 ](bg:#ffffff fg:#090c0c)\
[](fg:#ffffff bg:#3B76F0)\
$directory\
[](fg:#3B76F0 bg:#ABE047)\
$git_branch\
$git_commit\
$git_status${custom.git_staged_total}${custom.git_unstaged_deleted}\
[](fg:#ABE047)\
$character\
"""

add_newline = false

[line_break]
disabled = true

[directory]
truncation_length = 1
fish_style_pwd_dir_length = 1
format = "[ ﱮ $path ]($style)"
style = "bg:#3B76F0"

[git_branch]
format = '[ $symbol$branch(:$remote_branch)]($style)'
# symbol = "  "
symbol = " "
style = "bold bg:#ABE047 fg:#2E2E2E"

[git_commit]
format = '[ $tag ]($style)'
disabled = false
only_detached = false
tag_disabled = false
tag_symbol = ''
style = "bold fg:black bg:#ABE047"

# [git_status]
# format = '([$conflicted$stashed$deleted$renamed$modified$typechanged$staged$untracked$ahead_behind]($style))'
# style = "bold fg:black bg:#ABE047"
# staged = '[+$count](bold fg:#black bg:#ABE047)'
# modified = '[!$count ](bold fg:#EF8633 bg:#ABE047)'
# stashed = '[*${count} ](bold fg:black bg:#ABE047)'
# deleted = '[✘${count} ](bold fg:#EF8633 bg:#ABE047)'
# untracked = '[?${count} ](bold fg:#EF8633 bg:#ABE047)'
# # ahead = '[⇡${count}](bold fg:#EF8633 bg:#ABE047)'
# # behind = '[⇣${count}](bold fg:#EF8633 bg:#ABE047)'
# diverged = '[⇡${ahead_count}⇣${behind_count}](bold fg:black bg:#ABE047)'
# disabled = false

[git_status]
format = '([$stashed$conflicted$renamed$modified$typechanged$untracked$ahead_behind]($style))'
style = "bold fg:black bg:#ABE047"
staged = ''   # 用 custom 统一显示 staged 总数
deleted = ''  # 关闭内置 deleted（它是 staged delete）
modified = '[!$count ](bold fg:#EF8633 bg:#ABE047)'
stashed = '[*${count} ](bold fg:black bg:#ABE047)'
renamed = '[»${count} ](bold fg:#EF8633 bg:#ABE047)'
untracked = '[?${count} ](bold fg:#EF8633 bg:#ABE047)'
diverged = '[⇡${ahead_count}⇣${behind_count} ](bold fg:black bg:#ABE047)'
ahead = '[⇡${count} ](bold fg:#EF8633 bg:#ABE047)'
behind = '[⇣${count} ](bold fg:#EF8633 bg:#ABE047)'
conflicted = '[~${count} ](bold fg:#EF8633 bg:#ABE047)'
 
[custom.git_staged_total]
require_repo = true
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && ! git diff --cached --quiet'
command = 'c=$(git diff --cached --name-only | wc -l | tr -d " "); echo "+$c"'
format = '[$output ](bold fg:#EF8633 bg:#ABE047)'

[custom.git_unstaged_deleted]
require_repo = true
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1 && [ -n "$(git diff --name-only --diff-filter=D)" ]'
command = 'c=$(git diff --name-only --diff-filter=D | wc -l | tr -d " "); echo "✘$c"'
format = '[$output ](bold fg:#DC4B8B bg:#ABE047)'

[git_metrics]
format = '[\[+$added]($added_style)[/]($added_style)[-$deleted]($deleted_style)[\]]($added_style)'
added_style = "bold fg:#1C3A5E bg:#FCF392"
deleted_style = "bold fg:bright-red bg:#FCF392"
disabled = true

[hg_branch]
format = "[ $symbol$branch ]($style)"
symbol = " "

[cmd_duration]
format = "[  $duration ]($style)"
style = "fg:bright-white bg:18"

[character]
success_symbol = '[❯](bold #ABE047)'
error_symbol = '[✗](bold #E84D44)'

[time]
disabled = true
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[ 󱑍 $time ](bg:#1C3A5E fg:#8DFBD2)]($style)'
